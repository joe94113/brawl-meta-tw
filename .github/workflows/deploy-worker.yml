name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - workers/brawlstars-proxy/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare inputs
        id: cloudflare-config
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is empty. Add it in Settings > Secrets and variables > Actions > Secrets to deploy the Worker automatically."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_ACCOUNT_ID is empty. Add your Cloudflare account id in Settings > Secrets and variables > Actions > Secrets."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_WORKERS_SUBDOMAIN" ]; then
            echo "::notice::CLOUDFLARE_WORKERS_SUBDOMAIN is empty. Add it in Settings > Secrets and variables > Actions > Variables, for example joe94113."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Cloudflare inputs are required for a manual Worker deploy."
              exit 1
            fi
            echo "::notice::Skipping Worker deploy because Cloudflare inputs are not configured. GitHub Pages deploy is unaffected."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}

      - name: Show Wrangler version
        if: steps.cloudflare-config.outputs.ready == 'true'
        run: npx wrangler --version

      - name: Deploy player proxy
        if: steps.cloudflare-config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/brawlstars-proxy/wrangler.toml

      - name: Verify proxy CORS
        if: steps.cloudflare-config.outputs.ready == 'true'
        run: |
          PROXY_BASE="https://brawlstars-proxy.$CLOUDFLARE_WORKERS_SUBDOMAIN.workers.dev"
          HEADERS="$(mktemp)"
          STATUS="$(curl -sS -o /dev/null -D "$HEADERS" -w "%{http_code}" -X OPTIONS \
            -H "Origin: https://joe94113.github.io" \
            -H "Access-Control-Request-Method: GET" \
            "$PROXY_BASE/players/%232PVRQGQG")"
          cat "$HEADERS"
          if [ "$STATUS" != "204" ]; then
            echo "::error::Worker deployed, but OPTIONS check returned HTTP $STATUS."
            exit 1
          fi
          echo "Worker proxy is ready: $PROXY_BASE"
        env:
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}

      - name: Verify Brawl Time data proxy
        if: steps.cloudflare-config.outputs.ready == 'true'
        run: |
          PROXY_BASE="https://brawlstars-proxy.$CLOUDFLARE_WORKERS_SUBDOMAIN.workers.dev"
          BODY="$(mktemp)"
          STATUS="$(curl -sS -o "$BODY" -w "%{http_code}" "$PROXY_BASE/brawltime/tier-list/brawler")"
          if [ "$STATUS" != "200" ]; then
            cat "$BODY"
            echo "::error::Brawl Time data proxy returned HTTP $STATUS."
            exit 1
          fi
          if ! grep -q "vike_pageContext" "$BODY"; then
            head -c 500 "$BODY"
            echo "::error::Brawl Time data proxy response did not contain the expected page payload."
            exit 1
          fi
          echo "Brawl Time data proxy is ready: $PROXY_BASE/brawltime/tier-list/brawler"
        env:
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
