name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - workers/brawlstars-proxy/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare inputs
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Add it in Settings > Secrets and variables > Actions > Secrets."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty. Add your Cloudflare account id in Settings > Secrets and variables > Actions > Secrets."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_WORKERS_SUBDOMAIN" ]; then
            echo "::error::CLOUDFLARE_WORKERS_SUBDOMAIN is empty. Add it in Settings > Secrets and variables > Actions > Variables, for example joe94113."
            missing=1
          fi
          exit "$missing"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}

      - name: Show Wrangler version
        run: npx wrangler --version

      - name: Deploy player proxy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/brawlstars-proxy/wrangler.toml

      - name: Verify proxy CORS
        run: |
          PROXY_BASE="https://brawlstars-proxy.$CLOUDFLARE_WORKERS_SUBDOMAIN.workers.dev"
          HEADERS="$(mktemp)"
          STATUS="$(curl -sS -o /dev/null -D "$HEADERS" -w "%{http_code}" -X OPTIONS \
            -H "Origin: https://joe94113.github.io" \
            -H "Access-Control-Request-Method: GET" \
            "$PROXY_BASE/players/%232PVRQGQG")"
          cat "$HEADERS"
          if [ "$STATUS" != "204" ]; then
            echo "::error::Worker deployed, but OPTIONS check returned HTTP $STATUS."
            exit 1
          fi
          echo "Worker proxy is ready: $PROXY_BASE"
        env:
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
