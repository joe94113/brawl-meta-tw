name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate icons
        run: npm run assets:icons

      - name: Fetch public meta data
        run: npm run data:meta
        env:
          META_MAX_STALE_DAYS: 3

      - name: Verify player proxy base
        run: |
          if [ -z "$VITE_BRAWL_STARS_PROXY_BASE" ]; then
            echo "::error::VITE_BRAWL_STARS_PROXY_BASE is empty. Add it as a repository variable in Settings > Secrets and variables > Actions > Variables, then rerun this workflow."
            exit 1
          fi
          PROXY_BASE="${VITE_BRAWL_STARS_PROXY_BASE%/}"
          PROXY_HOST="$(node -e "const value = process.env.VITE_BRAWL_STARS_PROXY_BASE; try { console.log(new URL(value).host) } catch { process.exit(1) }")"
          echo "Using player proxy host: $PROXY_HOST"
          HEADERS="$(mktemp)"
          STATUS="$(curl -sS -o /dev/null -D "$HEADERS" -w "%{http_code}" -X OPTIONS \
            -H "Origin: https://joe94113.github.io" \
            -H "Access-Control-Request-Method: GET" \
            "$PROXY_BASE/players/%232PVRQGQG")"
          if [ "$STATUS" != "204" ]; then
            cat "$HEADERS"
            echo "::error::Player proxy OPTIONS check returned HTTP $STATUS for $PROXY_HOST. VITE_BRAWL_STARS_PROXY_BASE should point to the Cloudflare Worker API, for example https://brawlstars-proxy.joe94113.workers.dev."
            exit 1
          fi
          if ! grep -qi "^access-control-allow-origin: https://joe94113.github.io" "$HEADERS"; then
            cat "$HEADERS"
            echo "::error::Player proxy did not return the expected Access-Control-Allow-Origin header."
            exit 1
          fi
        env:
          VITE_BRAWL_STARS_PROXY_BASE: ${{ vars.VITE_BRAWL_STARS_PROXY_BASE }}

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: true
          VITE_BRAWL_STARS_PROXY_BASE: ${{ vars.VITE_BRAWL_STARS_PROXY_BASE }}

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
