name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate icons
        run: npm run assets:icons

      - name: Fetch public meta data
        run: npm run data:meta
        continue-on-error: true

      - name: Verify player proxy base
        run: |
          if [ -z "$VITE_BRAWL_STARS_PROXY_BASE" ]; then
            echo "::error::VITE_BRAWL_STARS_PROXY_BASE is empty. Add it as a repository variable or a github-pages environment variable, then rerun this workflow."
            exit 1
          fi
          echo "Using player proxy base: $VITE_BRAWL_STARS_PROXY_BASE"
        env:
          VITE_BRAWL_STARS_PROXY_BASE: ${{ vars.VITE_BRAWL_STARS_PROXY_BASE || secrets.VITE_BRAWL_STARS_PROXY_BASE }}

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: true
          VITE_BRAWL_STARS_PROXY_BASE: ${{ vars.VITE_BRAWL_STARS_PROXY_BASE || secrets.VITE_BRAWL_STARS_PROXY_BASE }}

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
